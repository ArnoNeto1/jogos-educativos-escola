<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete a Sequência</title>
<style>
  :root { --azul:#2563eb; --roxo:#8b5cf6; --amarelo:#fbbf24; --verde:#22c55e; --vermelho:#ef4444; --fundo:#f0f7ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    background: var(--fundo); color: #1e293b;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
  }
  a.voltar {
    align-self: flex-start;
    text-decoration: none; font-weight: 700; color: var(--azul);
    background: white; padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  h1 { margin: 10px 0 4px; text-align: center; }
  .instrucoes { max-width: 480px; text-align: center; color: #475569; margin-bottom: 20px; font-size: 1rem; }
  .cartao {
    background: white; border-radius: 20px; padding: 28px;
    box-shadow: 0 6px 16px rgba(30,64,175,0.12);
    width: 100%; max-width: 460px; text-align: center;
  }
  .escondido { display: none !important; }
  .btn-nivel {
    background: var(--fundo); border: none; border-radius: 14px;
    font-size: 1.05rem; font-weight: 700; color: #1e293b;
    padding: 16px; cursor: pointer; text-align: left;
  }
  .btn-nivel:hover { background: #dbeafe; }
  .btn-nivel small { display: block; font-weight: 400; color: #64748b; font-size: 0.8rem; }
  .progresso { font-weight: 700; color: #64748b; margin-bottom: 6px; }
  .pontuacao-atual { font-weight: 700; color: var(--verde); margin-bottom: 18px; }
  .sequencia {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .numero-caixa {
    background: var(--fundo); border-radius: 12px; min-width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 800; color: var(--azul);
  }
  .numero-caixa.interrogacao { background: var(--amarelo); color: #78350f; }
  .alternativas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .alt-btn {
    background: var(--fundo); border: none; border-radius: 14px;
    font-size: 1.5rem; font-weight: 800; color: #1e293b;
    padding: 16px 0; cursor: pointer;
  }
  .alt-btn:hover:not(:disabled) { background: #dbeafe; }
  .alt-btn:disabled { cursor: default; }
  .alt-btn.certa { background: var(--verde); color: white; }
  .alt-btn.errada { background: var(--vermelho); color: white; }
  .resultado-titulo { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
  .resultado-numero { font-size: 3rem; font-weight: 800; color: var(--azul); margin-bottom: 6px; }
  .resultado-percentual { color: #64748b; margin-bottom: 20px; }
  button.acao {
    background: var(--verde); color: white; border: none; font-weight: 700; font-size: 1.05rem;
    padding: 12px 30px; border-radius: 999px; cursor: pointer; margin-top: 6px;
  }
</style>
</head>
<body>

<a class="voltar" href="../index.html">⬅ Voltar</a>
<h1>🧩 Complete a Sequência</h1>
<p class="instrucoes">Descubra o padrão e escolha o próximo número da sequência!</p>

<div class="cartao" id="telaNivel">
  <h2 style="margin:0 0 16px; font-size:1.2rem;">Escolha o nível</h2>
  <div style="display:flex; flex-direction:column; gap:12px;">
    <button class="btn-nivel" data-nivel="facil">🟢 Fácil <small>(1º ao 3º ano) — sempre +1</small></button>
    <button class="btn-nivel" data-nivel="medio">🟡 Médio <small>(4º ao 6º ano) — passo de 1 a 5</small></button>
    <button class="btn-nivel" data-nivel="dificil">🔴 Difícil <small>(7º ao 9º ano) — passos maiores, também decrescentes</small></button>
  </div>
</div>

<div class="cartao escondido" id="telaJogo2">

  <div id="telaQuiz">
    <div class="progresso" id="progresso"></div>
    <div class="pontuacao-atual" id="pontuacaoAtual"></div>
    <div class="sequencia" id="sequencia"></div>
    <div class="alternativas" id="alternativas"></div>
  </div>

  <div id="telaResultado" class="escondido">
    <div class="resultado-titulo" id="resultadoTitulo"></div>
    <div class="resultado-numero" id="resultadoNumero"></div>
    <div class="resultado-percentual" id="resultadoPercentual"></div>
    <button class="acao" id="btnJogarNovamente">🔄 Jogar novamente</button>
  </div>

</div>

<script>
  var TOTAL_PERGUNTAS = 10;

  var telaQuiz = document.getElementById("telaQuiz");
  var telaResultado = document.getElementById("telaResultado");
  var progressoEl = document.getElementById("progresso");
  var pontuacaoAtualEl = document.getElementById("pontuacaoAtual");
  var sequenciaEl = document.getElementById("sequencia");
  var alternativasEl = document.getElementById("alternativas");
  var resultadoTitulo = document.getElementById("resultadoTitulo");
  var resultadoNumero = document.getElementById("resultadoNumero");
  var resultadoPercentual = document.getElementById("resultadoPercentual");
  var btnJogarNovamente = document.getElementById("btnJogarNovamente");

  var perguntas = [];
  var indiceAtual = 0;
  var acertos = 0;

  function embaralhar(lista) {
    var copia = lista.slice();
    for (var i = copia.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = copia[i]; copia[i] = copia[j]; copia[j] = temp;
    }
    return copia;
  }

  var NIVEIS = {
    facil: { inicioMax: 10, passoMax: 1, qtdTermos: 3, permiteDecrescente: false },
    medio: { inicioMax: 10, passoMax: 5, qtdTermos: 4, permiteDecrescente: false },
    dificil: { inicioMax: 40, passoMax: 10, qtdTermos: 4, permiteDecrescente: true }
  };
  var nivelEscolhido = "medio";

  function gerarPergunta() {
    var config = NIVEIS[nivelEscolhido];
    var inicio = Math.floor(Math.random() * config.inicioMax) + 1;
    var passo = Math.floor(Math.random() * config.passoMax) + 1;
    if (config.permiteDecrescente && Math.random() < 0.4) passo = -passo;
    var qtd = config.qtdTermos;
    var termos = [];
    for (var i = 0; i < qtd; i++) termos.push(inicio + passo * i);
    var proximo = inicio + passo * qtd;
    return { termos: termos, resposta: proximo };
  }

  function gerarPerguntas() {
    var lista = [];
    for (var i = 0; i < TOTAL_PERGUNTAS; i++) lista.push(gerarPergunta());
    return lista;
  }

  function gerarAlternativas(respostaCorreta) {
    var config = NIVEIS[nivelEscolhido];
    var opcoes = [respostaCorreta];
    var tentativas = 0;
    while (opcoes.length < 4 && tentativas < 200) {
      tentativas++;
      var variacao = Math.floor(Math.random() * 10) - 5; // -5 a +4
      var candidata = respostaCorreta + variacao;
      // fora do nível "difícil" (que permite sequências decrescentes/negativas), não mostra
      // alternativas negativas — evitaria confundir quem ainda não trabalhou com negativos
      if (!config.permiteDecrescente && candidata < 1) continue;
      if (opcoes.indexOf(candidata) !== -1) continue;
      opcoes.push(candidata);
    }
    return embaralhar(opcoes);
  }

  function iniciarQuiz(nivel) {
    if (nivel) nivelEscolhido = nivel;
    perguntas = gerarPerguntas();
    indiceAtual = 0;
    acertos = 0;
    telaResultado.classList.add("escondido");
    document.getElementById("telaNivel").classList.add("escondido");
    document.getElementById("telaJogo2").classList.remove("escondido");
    telaQuiz.classList.remove("escondido");
    mostrarPergunta();
  }

  function mostrarPergunta() {
    var p = perguntas[indiceAtual];
    progressoEl.textContent = "Pergunta " + (indiceAtual + 1) + " de " + perguntas.length;
    pontuacaoAtualEl.textContent = "Acertos: " + acertos;

    sequenciaEl.innerHTML = "";
    p.termos.forEach(function (termo) {
      var caixa = document.createElement("div");
      caixa.className = "numero-caixa";
      caixa.textContent = termo;
      sequenciaEl.appendChild(caixa);
    });
    var interrogacao = document.createElement("div");
    interrogacao.className = "numero-caixa interrogacao";
    interrogacao.textContent = "?";
    sequenciaEl.appendChild(interrogacao);

    var opcoes = gerarAlternativas(p.resposta);
    alternativasEl.innerHTML = "";
    opcoes.forEach(function (opcao) {
      var btn = document.createElement("button");
      btn.className = "alt-btn";
      btn.textContent = opcao;
      btn.addEventListener("click", function () { responder(opcao, p.resposta, btn); });
      alternativasEl.appendChild(btn);
    });
  }

  function responder(escolhida, correta, botaoClicado) {
    var botoes = alternativasEl.querySelectorAll(".alt-btn");
    botoes.forEach(function (b) { b.disabled = true; });

    if (escolhida === correta) {
      acertos++;
      botaoClicado.classList.add("certa");
    } else {
      botaoClicado.classList.add("errada");
      botoes.forEach(function (b) {
        if (Number(b.textContent) === correta) b.classList.add("certa");
      });
    }

    setTimeout(function () {
      indiceAtual++;
      if (indiceAtual < perguntas.length) {
        mostrarPergunta();
      } else {
        mostrarResultado();
      }
    }, 1000);
  }

  function mostrarResultado() {
    telaQuiz.classList.add("escondido");
    telaResultado.classList.remove("escondido");

    var percentual = Math.round((acertos / perguntas.length) * 100);
    resultadoNumero.textContent = acertos + " / " + perguntas.length;
    resultadoPercentual.textContent = percentual + "% de acerto";

    if (percentual >= 80) resultadoTitulo.textContent = "🏆 Excelente!";
    else if (percentual >= 50) resultadoTitulo.textContent = "👏 Muito bem!";
    else resultadoTitulo.textContent = "💪 Continue praticando!";
  }

  btnJogarNovamente.addEventListener("click", function () {
    telaResultado.classList.add("escondido");
    document.getElementById("telaJogo2").classList.add("escondido");
    document.getElementById("telaNivel").classList.remove("escondido");
  });

  document.querySelectorAll(".btn-nivel").forEach(function (btn) {
    btn.addEventListener("click", function () { iniciarQuiz(btn.dataset.nivel); });
  });
</script>
</body>
</html>
