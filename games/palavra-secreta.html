<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palavra Secreta</title>
<style>
  :root { --azul:#2563eb; --roxo:#8b5cf6; --amarelo:#eab308; --verde:#22c55e; --vermelho:#ef4444; --cinza:#94a3b8; --fundo:#f0f7ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    background: var(--fundo); color: #1e293b;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
  }
  a.voltar {
    align-self: flex-start;
    text-decoration: none; font-weight: 700; color: var(--azul);
    background: white; padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  h1 { margin: 10px 0 4px; text-align: center; }
  .instrucoes { max-width: 480px; text-align: center; color: #475569; margin-bottom: 16px; font-size: 0.95rem; }
  .escondido { display: none !important; }
  .cartao {
    background: white; border-radius: 20px; padding: 24px;
    box-shadow: 0 6px 16px rgba(30,64,175,0.12);
    width: 100%; max-width: 460px; text-align: center;
  }
  .btn-nivel {
    background: var(--fundo); border: none; border-radius: 14px;
    font-size: 1.05rem; font-weight: 700; color: #1e293b;
    padding: 16px; cursor: pointer; text-align: left; width: 100%; margin-bottom: 12px; display: block;
  }
  .btn-nivel:hover { background: #dbeafe; }
  .btn-nivel small { display: block; font-weight: 400; color: #64748b; font-size: 0.8rem; }

  .mensagem { font-weight: 700; min-height: 1.6em; margin-bottom: 10px; }
  .mensagem.certo { color: var(--verde); }
  .mensagem.errado { color: var(--vermelho); }

  .grade-tentativas { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-bottom: 18px; }
  .linha-tentativa { display: flex; gap: 6px; }
  .celula {
    width: 44px; height: 44px; border: 2px solid #cbd5e1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 800; color: #1e293b; background: white;
  }
  .celula.correta { background: var(--verde); border-color: var(--verde); color: white; }
  .celula.presente { background: var(--amarelo); border-color: var(--amarelo); color: white; }
  .celula.ausente { background: var(--cinza); border-color: var(--cinza); color: white; }

  .teclado { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .linha-teclado { display: flex; gap: 5px; }
  .tecla {
    min-width: 30px; height: 42px; padding: 0 6px; border: none; border-radius: 6px;
    background: #e2e8f0; font-weight: 700; font-size: 0.95rem; cursor: pointer; color: #1e293b;
  }
  .tecla:hover:not(:disabled) { background: #cbd5e1; }
  .tecla.especial { min-width: 56px; font-size: 0.8rem; }
  .tecla.correta { background: var(--verde); color: white; }
  .tecla.presente { background: var(--amarelo); color: white; }
  .tecla.ausente { background: #64748b; color: white; }

  .resultado-titulo { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
  .resultado-palavra { font-size: 1.8rem; font-weight: 800; color: var(--azul); margin-bottom: 14px; letter-spacing: 4px; }
  button.acao {
    background: var(--verde); color: white; border: none; font-weight: 700; font-size: 1.05rem;
    padding: 12px 30px; border-radius: 999px; cursor: pointer; margin-top: 6px;
  }
</style>
</head>
<body>

<a class="voltar" href="../index.html">⬅ Voltar</a>
<h1>🕵️ Palavra Secreta</h1>
<p class="instrucoes">Adivinhe a palavra! Depois de cada tentativa: 🟩 letra certa no lugar certo,
  🟨 letra certa no lugar errado, ⬜ letra que não está na palavra.</p>

<div class="cartao" id="telaNivel">
  <h2 style="margin:0 0 16px; font-size:1.2rem;">Escolha o nível</h2>
  <button class="btn-nivel" data-nivel="facil">🟢 Fácil <small>(1º ao 3º ano) — palavras de 4 letras, 6 tentativas</small></button>
  <button class="btn-nivel" data-nivel="medio">🟡 Médio <small>(4º ao 6º ano) — palavras de 5 letras, 6 tentativas</small></button>
  <button class="btn-nivel" data-nivel="dificil">🔴 Difícil <small>(7º ao 9º ano) — palavras de 6 letras, 5 tentativas</small></button>
</div>

<div class="cartao escondido" id="telaJogo2">
  <div id="telaJogo">
    <div class="mensagem" id="mensagem"></div>
    <div class="grade-tentativas" id="gradeTentativas"></div>
    <div class="teclado" id="teclado"></div>
  </div>

  <div id="telaResultado" class="escondido">
    <div class="resultado-titulo" id="resultadoTitulo"></div>
    <div class="resultado-palavra" id="resultadoPalavra"></div>
    <button class="acao" id="btnJogarNovamente">🔄 Jogar novamente</button>
  </div>
</div>

<script>
  // Sem acentos de propósito (mantém o teclado simples, só A-Z). Cada nível usa palavras do
  // próprio tamanho (não é cumulativo).
  var BANCO_PALAVRAS = {
    facil: ["CASA", "GATO", "BOLO", "PATO", "MESA", "SAPO", "LOBO", "REDE", "VIDA", "ROSA"],
    medio: ["TERRA", "LIVRO", "CARRO", "PORTA", "PRATO", "VERDE", "PRETO", "FESTA", "FRUTA", "NOITE", "FORTE", "CAMPO", "PONTE", "NUVEM", "FOLHA", "PEDRA"],
    dificil: ["JANELA", "ESCOLA", "BANANA", "MENINO", "MENINA", "ANIMAL", "BONITO", "FRANGO", "CAVALO", "SAPATO", "GAROTO", "GAROTA"]
  };
  var NIVEIS = {
    facil: { tamanho: 4, tentativas: 6 },
    medio: { tamanho: 5, tentativas: 6 },
    dificil: { tamanho: 6, tentativas: 5 }
  };
  var nivelEscolhido = "medio";

  var TECLADO_LINHAS = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];

  var mensagemEl = document.getElementById("mensagem");
  var gradeTentativasEl = document.getElementById("gradeTentativas");
  var tecladoEl = document.getElementById("teclado");
  var telaJogo = document.getElementById("telaJogo");
  var telaResultado = document.getElementById("telaResultado");
  var resultadoTitulo = document.getElementById("resultadoTitulo");
  var resultadoPalavra = document.getElementById("resultadoPalavra");
  var btnJogarNovamente = document.getElementById("btnJogarNovamente");

  var palavraSecreta = "";
  var tamanhoPalavra = 5;
  var maxTentativas = 6;
  var tentativaAtual = "";
  var numeroTentativa = 0;
  var jogoAcabou = false;
  var estadoTeclas = {}; // letra -> "correta" | "presente" | "ausente" (prioridade nessa ordem)

  function iniciarJogo(nivel) {
    if (nivel) nivelEscolhido = nivel;
    var config = NIVEIS[nivelEscolhido];
    tamanhoPalavra = config.tamanho;
    maxTentativas = config.tentativas;
    palavraSecreta = BANCO_PALAVRAS[nivelEscolhido][Math.floor(Math.random() * BANCO_PALAVRAS[nivelEscolhido].length)];
    tentativaAtual = "";
    numeroTentativa = 0;
    jogoAcabou = false;
    estadoTeclas = {};
    mensagemEl.textContent = "";
    mensagemEl.className = "mensagem";

    telaResultado.classList.add("escondido");
    document.getElementById("telaNivel").classList.add("escondido");
    document.getElementById("telaJogo2").classList.remove("escondido");
    telaJogo.classList.remove("escondido");

    construirGrade();
    construirTeclado();
  }

  function construirGrade() {
    gradeTentativasEl.innerHTML = "";
    for (var l = 0; l < maxTentativas; l++) {
      var linha = document.createElement("div");
      linha.className = "linha-tentativa";
      linha.dataset.linha = l;
      for (var c = 0; c < tamanhoPalavra; c++) {
        var celula = document.createElement("div");
        celula.className = "celula";
        celula.dataset.coluna = c;
        linha.appendChild(celula);
      }
      gradeTentativasEl.appendChild(linha);
    }
  }

  function construirTeclado() {
    tecladoEl.innerHTML = "";
    TECLADO_LINHAS.forEach(function (letras, indiceLinha) {
      var linha = document.createElement("div");
      linha.className = "linha-teclado";
      if (indiceLinha === 2) {
        linha.appendChild(criarTecla("APAGAR", "especial"));
      }
      letras.split("").forEach(function (letra) {
        linha.appendChild(criarTecla(letra));
      });
      if (indiceLinha === 2) {
        linha.appendChild(criarTecla("ENVIAR", "especial"));
      }
      tecladoEl.appendChild(linha);
    });
  }

  function criarTecla(rotulo, classeExtra) {
    var btn = document.createElement("button");
    btn.className = "tecla" + (classeExtra ? " " + classeExtra : "");
    btn.textContent = rotulo === "APAGAR" ? "⌫" : (rotulo === "ENVIAR" ? "Enviar" : rotulo);
    btn.dataset.letra = rotulo;
    btn.addEventListener("click", function () { aoTeclar(rotulo); });
    return btn;
  }

  document.addEventListener("keydown", function (e) {
    if (jogoAcabou || telaJogo.classList.contains("escondido")) return;
    var tecla = e.key.toUpperCase();
    if (tecla === "BACKSPACE") aoTeclar("APAGAR");
    else if (tecla === "ENTER") aoTeclar("ENVIAR");
    else if (/^[A-Z]$/.test(tecla)) aoTeclar(tecla);
  });

  function aoTeclar(tecla) {
    if (jogoAcabou) return;
    if (tecla === "APAGAR") {
      tentativaAtual = tentativaAtual.slice(0, -1);
    } else if (tecla === "ENVIAR") {
      enviarTentativa();
      return;
    } else if (tentativaAtual.length < tamanhoPalavra) {
      tentativaAtual += tecla;
    }
    atualizarLinhaAtual();
  }

  function atualizarLinhaAtual() {
    var linha = gradeTentativasEl.querySelector('[data-linha="' + numeroTentativa + '"]');
    var celulas = linha.querySelectorAll(".celula");
    celulas.forEach(function (celula, i) {
      celula.textContent = tentativaAtual[i] || "";
    });
  }

  function enviarTentativa() {
    if (tentativaAtual.length < tamanhoPalavra) {
      mensagemEl.textContent = "Complete as " + tamanhoPalavra + " letras antes de enviar!";
      mensagemEl.className = "mensagem errado";
      return;
    }
    mensagemEl.textContent = "";

    var resultado = avaliarTentativa(tentativaAtual, palavraSecreta);
    pintarLinha(numeroTentativa, resultado);
    atualizarEstadoTeclas(tentativaAtual, resultado);

    if (tentativaAtual === palavraSecreta) {
      jogoAcabou = true;
      setTimeout(function () { finalizarJogo(true); }, 900);
      return;
    }

    numeroTentativa++;
    tentativaAtual = "";

    if (numeroTentativa >= maxTentativas) {
      jogoAcabou = true;
      setTimeout(function () { finalizarJogo(false); }, 900);
    }
  }

  // algoritmo padrão de Wordle: primeiro marca as certas, depois distribui as "presentes"
  // respeitando a quantidade de cada letra que ainda sobra na palavra secreta
  function avaliarTentativa(tentativa, secreta) {
    var resultado = new Array(tentativa.length).fill("ausente");
    var sobra = {};
    for (var i = 0; i < secreta.length; i++) {
      sobra[secreta[i]] = (sobra[secreta[i]] || 0) + 1;
    }
    for (var i = 0; i < tentativa.length; i++) {
      if (tentativa[i] === secreta[i]) {
        resultado[i] = "correta";
        sobra[tentativa[i]]--;
      }
    }
    for (var i = 0; i < tentativa.length; i++) {
      if (resultado[i] === "correta") continue;
      var letra = tentativa[i];
      if (sobra[letra] > 0) {
        resultado[i] = "presente";
        sobra[letra]--;
      }
    }
    return resultado;
  }

  function pintarLinha(numeroLinha, resultado) {
    var linha = gradeTentativasEl.querySelector('[data-linha="' + numeroLinha + '"]');
    var celulas = linha.querySelectorAll(".celula");
    celulas.forEach(function (celula, i) {
      celula.classList.add(resultado[i]);
    });
  }

  function atualizarEstadoTeclas(tentativa, resultado) {
    var prioridade = { ausente: 0, presente: 1, correta: 2 };
    for (var i = 0; i < tentativa.length; i++) {
      var letra = tentativa[i], novoEstado = resultado[i];
      var estadoAtual = estadoTeclas[letra];
      if (!estadoAtual || prioridade[novoEstado] > prioridade[estadoAtual]) {
        estadoTeclas[letra] = novoEstado;
      }
    }
    tecladoEl.querySelectorAll(".tecla[data-letra]").forEach(function (btn) {
      var letra = btn.dataset.letra;
      var estado = estadoTeclas[letra];
      btn.classList.remove("correta", "presente", "ausente");
      if (estado) btn.classList.add(estado);
    });
  }

  function finalizarJogo(venceu) {
    telaJogo.classList.add("escondido");
    telaResultado.classList.remove("escondido");
    resultadoTitulo.textContent = venceu
      ? "🎉 Parabéns! Você acertou em " + (numeroTentativa + 1) + " tentativa(s)!"
      : "😅 Não foi dessa vez! A palavra era:";
    resultadoPalavra.textContent = palavraSecreta;
  }

  btnJogarNovamente.addEventListener("click", function () {
    telaResultado.classList.add("escondido");
    document.getElementById("telaJogo2").classList.add("escondido");
    document.getElementById("telaNivel").classList.remove("escondido");
  });

  document.querySelectorAll(".btn-nivel").forEach(function (btn) {
    btn.addEventListener("click", function () { iniciarJogo(btn.dataset.nivel); });
  });
</script>
</body>
</html>
